<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     fill="none" 
     viewBox="0 0 24 24" 
     stroke="currentColor"
     stroke-width="1.5"
     aria-hidden="true" 
     role="img">
    <style>
        .health-heart { 
            animation: heartbeat 2s ease-in-out infinite;
            transform-origin: center;
        }
        .health-cross { 
            animation: glow 3s ease-in-out infinite alternate;
        }
        .health-pulse { 
            animation: pulse 1.5s ease-in-out infinite;
            stroke-dasharray: 20 5;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.05); }
        }
        
        @keyframes glow {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 25; }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .health-heart, .health-cross, .health-pulse { animation: none; }
        }
    </style>
    
    <!-- Croce medica di sfondo -->
    <g class="health-cross" opacity="0.2">
        <rect x="10.5" y="4" width="3" height="16" rx="1.5" fill="currentColor" />
        <rect x="4" y="10.5" width="16" height="3" rx="1.5" fill="currentColor" />
    </g>
    
    <!-- Cuore principale -->
    <path class="health-heart"
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2"
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" 
          fill="currentColor" 
          opacity="0.8" />
    
    <!-- Linea del battito cardiaco -->
    <path class="health-pulse"
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2"
          d="M3 12h3l2-4 4 8 2-4h3" 
          opacity="0.9" />
    
    <!-- Simbolo + medico -->
    <g transform="translate(16, 6)" opacity="0.9">
        <circle cx="2" cy="2" r="3" fill="currentColor" opacity="0.1" />
        <path stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="1.5"
              d="M2 1v2M1 2h2" />
    </g>
    
    <!-- Indicatori di salute -->
    <circle cx="6" cy="8" r="1" fill="currentColor" opacity="0.6" />
    <circle cx="18" cy="16" r="1" fill="currentColor" opacity="0.5" />
</svg>
