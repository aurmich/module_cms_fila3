<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SaluteOra module alternate icon">
  <style>
    @media (prefers-color-scheme: dark) {
      .primary { stroke: #f8fafc; } /* Light color for dark theme */
      .secondary { stroke: #e2e8f0; } /* Slightly lighter for contrast */
    }
    @media (prefers-color-scheme: light) {
      .primary { stroke: #1e40af; } /* Dark blue for light theme */
      .secondary { stroke: #3b82f6; } /* Lighter blue for contrast */
    }
    
    /* Animation for the pulse effect */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .pulse {
      animation: pulse 2s infinite;
      transform-origin: center;
    }
    
    /* Animation for the circular motion */
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .rotate {
      animation: rotate 15s linear infinite;
      transform-origin: center;
    }
    
    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .pulse, .rotate {
        animation: none;
      }
    }
  </style>
  
  <!-- Main medical cross -->
  <line x1="12" y1="6" x2="12" y2="18" class="primary" stroke-width="1.8" stroke-linecap="round" />
  <line x1="6" y1="12" x2="18" y2="12" class="primary" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Outer circle -->
  <circle cx="12" cy="12" r="10" class="secondary" stroke-width="1.2" fill="none" />
  
  <!-- Inner circle with subtle pulse effect -->
  <circle cx="12" cy="12" r="7" class="primary pulse" stroke-width="0.8" fill="none" stroke-dasharray="1, 3" />
  
  <!-- Rotating dots around the circle -->
  <g class="rotate">
    <circle cx="12" cy="4" r="0.8" class="primary" fill="currentColor" />
    <circle cx="12" cy="20" r="0.8" class="primary" fill="currentColor" />
    <circle cx="4" cy="12" r="0.8" class="primary" fill="currentColor" />
    <circle cx="20" cy="12" r="0.8" class="primary" fill="currentColor" />
  </g>
  
  <!-- Subtle background circle -->
  <circle cx="12" cy="12" r="11" class="secondary" stroke-width="0.5" fill="none" opacity="0.5" />
</svg>
