<svg xmlns="http://www.w3.org/2000/svg" width="300" height="60" viewBox="0 0 300 60">
  <defs>
    <style>
      .text { font-family: Inter, sans-serif; font-weight: 700; font-size: 36px; fill: #111827; }
      .accent { fill: #10B981; }
      .icon { fill: white; }
    </style>
  </defs>
  <text x="0" y="45" class="text">SALUTE</text>
  <g transform="translate(100,0)">
    <circle cx="30" cy="30" r="25" class="accent"/>
    <!-- Pregnant silhouette: head -->
    <circle cx="30" cy="18" r="8" class="icon"/>
    <!-- Belly -->
    <path d="M20 40 C20 30 40 30 40 40 C40 50 30 50 30 60 C20 50 20 50 20 40 Z" class="icon"/>
  </g>
  <text x="160" y="45" class="text">RALE</text>
</svg>
