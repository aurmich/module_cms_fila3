<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Sfondo -->
    <rect width="120" height="120" fill="#000000"/> <!-- Nero -->
    
    <!-- Cerchio con O -->
    <circle cx="60" cy="60" r="40" fill="white"/>
    <text x="60" y="70" font-family="Arial, sans-serif" font-size="40" fill="#000000" text-anchor="middle">
        <tspan font-weight="lighter">O</tspan>
    </text>
    
    <!-- Testo le -->
    <text x="60" y="100" font-family="Arial, sans-serif" font-size="20" fill="#999999" font-style="italic" text-anchor="middle">
        le
    </text>
</svg> 