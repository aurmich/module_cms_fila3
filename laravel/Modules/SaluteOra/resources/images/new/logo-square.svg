<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SaluteOra Square">
  <title>SaluteOra Square</title>
  
  <!-- Sfondo quadrato blu scuro -->
  <rect width="150" height="150" fill="#0d2b4a"/>
  
  <!-- Elementi decorativi - onde fluide in background -->
  <path d="M0 100c25-10 50 10 75 0s50-10 75 0" stroke="#1a4980" fill="none" stroke-width="2" opacity="0.3"/>
  <path d="M0 120c25-10 50 10 75 0s50-10 75 0" stroke="#1a4980" fill="none" stroke-width="2" opacity="0.2"/>
  
  <!-- Testo "SALUTE" centrato nella parte superiore -->
  <g id="text-salute" fill="#ffffff" transform="translate(25, 40)">
    <!-- S -->
    <path d="M5 10c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2h-8c-1.1 0-2-.9-2-2v-2zm0 10c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2h-8c-1.1 0-2-.9-2-2v-2z" stroke-width="0.5" stroke="#ffffff"/>
    
    <!-- A -->
    <path d="M20 10h4l6 20h-4l-1-4h-6l-1 4h-4l6-20zm4 12l-2-8-2 8h4z"/>
    
    <!-- L -->
    <path d="M35 10h4v16h8v4h-12v-20z"/>
    
    <!-- U -->
    <path d="M50 10h4v12c0 2.2 1.8 4 4 4s4-1.8 4-4v-12h4v12c0 4.4-3.6 8-8 8s-8-3.6-8-8v-12z"/>
    
    <!-- T -->
    <path d="M70 10h12v4h-4v16h-4v-16h-4v-4z"/>
    
    <!-- E -->
    <path d="M85 10h12v4h-8v4h6v4h-6v4h8v4h-12v-20z"/>
  </g>
  
  <!-- Testo "ORA" centrato nella parte centrale -->
  <g id="text-ora" fill="#ffffff" transform="translate(40, 80)">
    <!-- O -->
    <path d="M5 10c0-5.5 4.5-10 10-10s10 4.5 10 10-4.5 10-10 10-10-4.5-10-10zm4 0c0 3.3 2.7 6 6 6s6-2.7 6-6-2.7-6-6-6-6 2.7-6 6z" stroke-width="0.5" stroke="#ffffff"/>
    
    <!-- R -->
    <path d="M30 0h10c2.2 0 4 1.8 4 4v4c0 2.2-1.8 4-4 4h-2l6 8h-5l-5-8h-0v8h-4v-20zm4 4v4h6v-4h-6z"/>
    
    <!-- A -->
    <path d="M50 0h4l6 20h-4l-1-4h-6l-1 4h-4l6-20zm4 12l-2-8-2 8h4z"/>
  </g>
  
  <!-- Testo "le" in corsivo e grigio chiaro -->
  <g id="text-le" fill="#cccccc" font-style="italic" transform="translate(100, 105)">
    <path d="M0 0c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2h-4v1h6v2h-8v-7zm2 0v2h4v-2h-4z"/>
    <path d="M10 -5h2v12h-2v-12zm0-3h2v2h-2v-2z"/>
  </g>
</svg>
