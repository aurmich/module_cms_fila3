<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo conforme alla descrizione in /docs/images:
  - Cerchio blu navy
  - Iniziali "SO" bianche, centrate
  - Completamente scalabile (SVG puro, viewBox 0 0 100 100)
  - Sfondo trasparente
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo SO">
  <title>Logo SO</title>
  <!-- Cerchio di sfondo -->
  <circle cx="50" cy="50" r="50" fill="#001F3F" />

  <!-- Lettere "S" e "O" -->
  <text x="50" y="57" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" dominant-baseline="middle">
    SO
  </text>
</svg>
