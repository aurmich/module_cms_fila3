<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon per tema One - SaluteOra
  - Design ispirato al logo principale
  - Iniziali "SO" in cerchio blu navy
  - Sfondo trasparente per compatibilità
  - Dimensioni ottimizzate per favicon (32x32 viewBox)
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Favicon SaluteOra">
  <title>SaluteOra</title>
  
  <!-- Cerchio di sfondo blu navy -->
  <circle cx="16" cy="16" r="15" fill="#001F3F" />
  
  <!-- Iniziali SO in bianco -->
  <text x="16" y="20" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" dominant-baseline="middle">SO</text>
</svg>
