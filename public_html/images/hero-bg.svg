<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Sfondo con gradiente -->
    <defs>
        <linearGradient id="bg-gradient" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#EBF4FF"/>
            <stop offset="100%" stop-color="#E1EFFE"/>
        </linearGradient>
        <!-- Pattern a onde -->
        <pattern id="wave-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
            <path d="M0 25C50 25 50 75 100 75C150 75 150 25 200 25" stroke="#93C5FD" stroke-width="2" fill="none"/>
            <path d="M0 50C50 50 50 100 100 100C150 100 150 50 200 50" stroke="#60A5FA" stroke-width="2" fill="none"/>
            <path d="M0 75C50 75 50 125 100 125C150 125 150 75 200 75" stroke="#3B82F6" stroke-width="2" fill="none"/>
        </pattern>
    </defs>

    <!-- Sfondo base -->
    <rect width="1920" height="1080" fill="url(#bg-gradient)"/>

    <!-- Pattern decorativo -->
    <rect width="1920" height="1080" fill="url(#wave-pattern)" opacity="0.1"/>

    <!-- Forme decorative -->
    <circle cx="200" cy="200" r="100" fill="#60A5FA" opacity="0.1"/>
    <circle cx="1720" cy="880" r="150" fill="#3B82F6" opacity="0.1"/>

    <!-- Linee decorative -->
    <path d="M0 300 Q 960 400 1920 300" stroke="#BFDBFE" stroke-width="3" fill="none"/>
    <path d="M0 600 Q 960 700 1920 600" stroke="#93C5FD" stroke-width="2" fill="none"/>
    <path d="M0 900 Q 960 1000 1920 900" stroke="#60A5FA" stroke-width="1" fill="none"/>
</svg>
