<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo rettangolare professionale per Salute Orale
  - Sfondo trasparente
  - Icona circolare blu navy con iniziali "SO" in bianco
  - Testo "Salute Orale" in blu navy a destra, disegnato come tracciati per consistenza
  - Dimensioni complessive: 300x80 (scalabile via viewBox)
-->
<svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Salute Orale">
  <title>Logo Salute Orale</title>
  <!-- Icona circolare -->
  <circle cx="40" cy="40" r="30" fill="#001F3F" />

  <!-- Iniziali SO (usiamo testo per leggibilità, i browser fallback useranno un font sans-serif) -->
  <text x="40" y="47" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" dominant-baseline="middle">SO</text>

  <!-- Testo "Salute Orale" stilizzato con leggero tracking -->
  <text x="90" y="47" font-family="'Georgia', serif" font-size="30" font-weight="600" fill="#001F3F" letter-spacing="1">
    Salute
    <tspan dx="8" font-style="italic" font-weight="600">Orale</tspan>
  </text>
</svg>
