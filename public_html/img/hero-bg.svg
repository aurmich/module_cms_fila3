<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.3" />
        </linearGradient>
    </defs>

    <!-- Sfondo base -->
    <rect width="100%" height="100%" fill="url(#grad1)"/>

    <!-- Forme organiche -->
    <path d="M0,400 Q480,300 960,400 T1920,400 V1080 H0 Z" fill="url(#grad2)" opacity="0.6">
        <animate attributeName="d"
                 dur="20s"
                 repeatCount="indefinite"
                 values="M0,400 Q480,300 960,400 T1920,400 V1080 H0 Z;
                        M0,420 Q480,350 960,420 T1920,420 V1080 H0 Z;
                        M0,400 Q480,300 960,400 T1920,400 V1080 H0 Z"/>
    </path>

    <!-- Cerchi decorativi -->
    <g fill="#60a5fa" opacity="0.1">
        <circle cx="200" cy="200" r="100">
            <animate attributeName="r"
                     dur="4s"
                     values="100;120;100"
                     repeatCount="indefinite"/>
        </circle>
        <circle cx="1720" cy="300" r="150">
            <animate attributeName="r"
                     dur="6s"
                     values="150;180;150"
                     repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Pattern a puntini -->
    <g fill="#3b82f6" opacity="0.1">
        <circle cx="400" cy="500" r="3"/>
        <circle cx="420" cy="520" r="3"/>
        <circle cx="440" cy="500" r="3"/>
        <circle cx="1500" cy="200" r="3"/>
        <circle cx="1520" cy="220" r="3"/>
        <circle cx="1540" cy="200" r="3"/>
    </g>

    <!-- Simboli della salute stilizzati -->
    <g fill="none" stroke="#2563eb" stroke-width="2" opacity="0.2">
        <path d="M960,100 l20,0 l0,20 l20,0 l0,20 l-20,0 l0,20 l-20,0 l0,-20 l-20,0 l0,-20 l20,0 z"/>
        <circle cx="1200" cy="150" r="30"/>
        <path d="M700,200 q50,-50 100,0 q50,50 100,0"/>
    </g>
</svg>
